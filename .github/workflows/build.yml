name: Build

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 获取仓库文件
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: 手动安装 Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "GRADLE_HOME=$PWD/gradle-8.9" >> $GITHUB_ENV
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH

      - name: 赋予 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: 使用 Gradle 构建
        run: gradle build

      - name: 上传 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: random-enchant-snapshot
          path: build/libs/*.jar
