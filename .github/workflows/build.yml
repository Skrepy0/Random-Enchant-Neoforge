name: Build

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 获取仓库文件
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: 配置 Java 信任库
        run: |
          echo "JAVA_TOOL_OPTIONS=-Djavax.net.ssl.trustStore=/etc/ssl/certs/java/cacerts -Djavax.net.ssl.trustStorePassword=changeit" >> $GITHUB_ENV

      - name: 赋予 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: 使用 Gradle 构建
        run: ./gradlew build -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3

      - name: 上传 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: random-enchant-snapshot
          path: build/libs/*.jar
